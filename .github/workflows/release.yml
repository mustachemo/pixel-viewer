name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${VERSION}]" 'index($0, "## [") == 1 { in_section = index($0, heading) == 1; next } in_section' \
            CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Pixel Viewer ${GITHUB_REF_NAME}" --notes-file release-notes.md
