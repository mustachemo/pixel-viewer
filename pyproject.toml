[project]
name = "pixel-viewer"
version = "0.1.0"
description = "A fast, native image viewer that shows the value of every pixel as you zoom in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mohamed Hasan", email = "mhasan1080@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["image-viewer", "pixel", "computer-vision", "segmentation", "mask", "qt", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.11.2",
]

[project.urls]
Homepage = "https://github.com/mustachemo/pixel-viewer"
Issues = "https://github.com/mustachemo/pixel-viewer/issues"
Changelog = "https://github.com/mustachemo/pixel-viewer/blob/main/CHANGELOG.md"

[project.scripts]
pixel-viewer = "pixel_viewer.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
